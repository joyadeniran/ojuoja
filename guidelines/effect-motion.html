<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:#fff;font-family:var(--font-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.n{font:600 11px/1.3 var(--font-body);color:var(--text-heading)}.h{font:500 10px/1.3 var(--font-mono);color:var(--text-faint);letter-spacing:.02em}.grid{display:flex;gap:10px}.grid>*{flex:1}.lbl{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;gap:22px;flex-wrap:wrap"><div class="sw"><div style="width:96px;height:6px;border-radius:3px;background:var(--surface-brand-soft);position:relative"><div style="position:absolute;inset:0 40% 0 0;background:var(--surface-brand);border-radius:3px"></div></div><span class="n">instant</span><span class="h">90ms</span></div><div class="sw"><div style="width:96px;height:6px;border-radius:3px;background:var(--surface-brand-soft);position:relative"><div style="position:absolute;inset:0 40% 0 0;background:var(--surface-brand);border-radius:3px"></div></div><span class="n">fast</span><span class="h">140ms</span></div><div class="sw"><div style="width:96px;height:6px;border-radius:3px;background:var(--surface-brand-soft);position:relative"><div style="position:absolute;inset:0 40% 0 0;background:var(--surface-brand);border-radius:3px"></div></div><span class="n">base</span><span class="h">200ms</span></div><div class="sw"><div style="width:96px;height:6px;border-radius:3px;background:var(--surface-brand-soft);position:relative"><div style="position:absolute;inset:0 40% 0 0;background:var(--surface-brand);border-radius:3px"></div></div><span class="n">slow</span><span class="h">320ms</span></div><div class="sw"><div style="width:96px;height:6px;border-radius:3px;background:var(--surface-brand-soft);position:relative"><div style="position:absolute;inset:0 40% 0 0;background:var(--surface-brand);border-radius:3px"></div></div><span class="n">page</span><span class="h">460ms</span></div></div>
<div class="h" style="margin-top:12px">--ease-out cubic-bezier(.2,.8,.3,1) · --ease-entrance cubic-bezier(.16,.84,.44,1) · lift -2px · press 0.97</div>
</body></html>
