<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:#fff;font-family:var(--font-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.n{font:600 11px/1.3 var(--font-body);color:var(--text-heading)}.h{font:500 10px/1.3 var(--font-mono);color:var(--text-faint);letter-spacing:.02em}.grid{display:flex;gap:10px}.grid>*{flex:1}.lbl{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div class="grid"><div class="sw"><div class="chip" style="background:#FFFFFF"></div><span class="n">white</span><span class="h">#FFFFFF</span></div><div class="sw"><div class="chip" style="background:#F6F7F7"></div><span class="n">grey-50</span><span class="h">#F6F7F7</span></div><div class="sw"><div class="chip" style="background:#EDEEEE"></div><span class="n">grey-100</span><span class="h">#EDEEEE</span></div><div class="sw"><div class="chip" style="background:#E4E6E5"></div><span class="n">grey-200</span><span class="h">#E4E6E5</span></div><div class="sw"><div class="chip" style="background:#D2D6D4"></div><span class="n">grey-300</span><span class="h">#D2D6D4</span></div><div class="sw"><div class="chip" style="background:#9AA3A0"></div><span class="n">grey-400</span><span class="h">#9AA3A0</span></div><div class="sw"><div class="chip" style="background:#6B7472"></div><span class="n">grey-500</span><span class="h">#6B7472</span></div><div class="sw"><div class="chip" style="background:#4A5250"></div><span class="n">grey-600</span><span class="h">#4A5250</span></div><div class="sw"><div class="chip" style="background:#262B2A"></div><span class="n">grey-800</span><span class="h">#262B2A</span></div></div>
</body></html>
