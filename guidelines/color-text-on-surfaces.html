<!-- @dsCard group="Colors" viewport="700x170" name="Text on surfaces" subtitle="Which ink is legal on which background" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:#fff;font-family:var(--font-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.n{font:600 11px/1.3 var(--font-body);color:var(--text-heading)}.h{font:500 10px/1.3 var(--font-mono);color:var(--text-faint);letter-spacing:.02em}.grid{display:flex;gap:10px}.grid>*{flex:1}.lbl{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div class="grid" style="align-items:stretch">
<div style="padding:14px;border:1px solid var(--border-subtle);border-radius:var(--radius-md)"><div style="font:700 17px/1.2 var(--font-display);color:var(--text-heading)">Heading ink</div><div style="color:var(--text-body);font-size:13px;margin-top:6px">Body on white</div><div style="color:var(--text-muted);font-size:12px">Muted</div></div>
<div style="padding:14px;background:var(--surface-lime);border-radius:var(--radius-md)"><div style="font:700 17px/1.2 var(--font-display);color:var(--text-on-lime)">On lime</div><div style="color:var(--oj-green-800);font-size:13px;margin-top:6px">Deep green body</div></div>
<div style="padding:14px;background:var(--surface-brand);border-radius:var(--radius-md)"><div style="font:700 17px/1.2 var(--font-display);color:#fff">On green</div><div style="color:rgba(255,255,255,.82);font-size:13px;margin-top:6px">White at 82%</div></div>
<div style="padding:14px;background:var(--surface-accent);border-radius:var(--radius-md)"><div style="font:700 17px/1.2 var(--font-display);color:var(--text-on-accent)">On yellow</div><div style="color:var(--oj-green-900);font-size:13px;margin-top:6px">Deep green only</div></div>
</div>
</body></html>
