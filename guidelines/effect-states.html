<!-- @dsCard group="Effects" viewport="700x180" name="Interaction states" subtitle="Hover darkens, press shrinks to 0.97, focus rings green at 28%" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:#fff;font-family:var(--font-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.n{font:600 11px/1.3 var(--font-body);color:var(--text-heading)}.h{font:500 10px/1.3 var(--font-mono);color:var(--text-faint);letter-spacing:.02em}.grid{display:flex;gap:10px}.grid>*{flex:1}.lbl{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
<div style="height:44px;padding:0 24px;border-radius:999px;background:var(--oj-green-700);color:#fff;display:flex;align-items:center;font:600 13px/1 var(--font-body)">Rest</div>
<div style="height:44px;padding:0 24px;border-radius:999px;background:var(--oj-green-800);color:#fff;display:flex;align-items:center;font:600 13px/1 var(--font-body)">Hover</div>
<div style="height:44px;padding:0 24px;border-radius:999px;background:var(--oj-green-800);color:#fff;display:flex;align-items:center;font:600 13px/1 var(--font-body);transform:scale(.97)">Press 0.97</div>
<div style="height:44px;padding:0 24px;border-radius:999px;background:var(--oj-green-700);color:#fff;display:flex;align-items:center;font:600 13px/1 var(--font-body);box-shadow:var(--focus-ring)">Focus</div>
<div style="height:44px;padding:0 24px;border-radius:999px;background:var(--oj-green-700);color:#fff;display:flex;align-items:center;font:600 13px/1 var(--font-body);opacity:.42">Disabled</div></div>
</body></html>
