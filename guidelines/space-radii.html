<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:#fff;font-family:var(--font-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.n{font:600 11px/1.3 var(--font-body);color:var(--text-heading)}.h{font:500 10px/1.3 var(--font-mono);color:var(--text-faint);letter-spacing:.02em}.grid{display:flex;gap:10px}.grid>*{flex:1}.lbl{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div style="display:flex;gap:12px;align-items:flex-end"><div class="sw"><div style="width:88px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:6px"></div><span class="n">xs</span><span class="h">6px</span></div><div class="sw"><div style="width:88px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:8px"></div><span class="n">sm</span><span class="h">8px</span></div><div class="sw"><div style="width:88px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:12px"></div><span class="n">md</span><span class="h">12px</span></div><div class="sw"><div style="width:88px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:16px"></div><span class="n">lg</span><span class="h">16px</span></div><div class="sw"><div style="width:88px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:24px"></div><span class="n">xl</span><span class="h">24px</span></div><div class="sw"><div style="width:88px;height:60px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:32px"></div><span class="n">2xl</span><span class="h">32px</span></div>
<div class="sw"><div style="width:88px;height:44px;background:var(--surface-brand);border-radius:999px"></div><span class="n">pill</span><span class="h">999px</span></div></div>
</body></html>
