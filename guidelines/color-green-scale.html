<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:#fff;font-family:var(--font-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.n{font:600 11px/1.3 var(--font-body);color:var(--text-heading)}.h{font:500 10px/1.3 var(--font-mono);color:var(--text-faint);letter-spacing:.02em}.grid{display:flex;gap:10px}.grid>*{flex:1}.lbl{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div class="grid"><div class="sw"><div class="chip" style="background:#E9F7EF"></div><span class="n">50</span><span class="h">#E9F7EF</span></div><div class="sw"><div class="chip" style="background:#CFEBDC"></div><span class="n">100</span><span class="h">#CFEBDC</span></div><div class="sw"><div class="chip" style="background:#A8DBBF"></div><span class="n">200</span><span class="h">#A8DBBF</span></div><div class="sw"><div class="chip" style="background:#5FBB8A"></div><span class="n">300</span><span class="h">#5FBB8A</span></div><div class="sw"><div class="chip" style="background:#30A668"></div><span class="n">400</span><span class="h">#30A668</span></div><div class="sw"><div class="chip" style="background:#00B737"></div><span class="n">500</span><span class="h">#00B737</span></div><div class="sw"><div class="chip" style="background:#00A03D"></div><span class="n">600</span><span class="h">#00A03D</span></div><div class="sw"><div class="chip" style="background:#009245"></div><span class="n">700</span><span class="h">#009245</span></div><div class="sw"><div class="chip" style="background:#06693A"></div><span class="n">800</span><span class="h">#06693A</span></div><div class="sw"><div class="chip" style="background:#084525"></div><span class="n">900</span><span class="h">#084525</span></div></div>
</body></html>
