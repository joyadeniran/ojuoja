<!-- @dsCard group="Colors" viewport="700x150" name="Status colors" subtitle="Success, warning, danger, info and their soft tints" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px 20px;background:#fff;font-family:var(--font-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}.n{font:600 11px/1.3 var(--font-body);color:var(--text-heading)}.h{font:500 10px/1.3 var(--font-mono);color:var(--text-faint);letter-spacing:.02em}.grid{display:flex;gap:10px}.grid>*{flex:1}.lbl{font:600 10px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}</style></head><body>
<div class="grid">
<div class="sw"><div class="chip" style="background:var(--color-success-soft);border:1px solid var(--color-success)"></div><span class="n">Success</span><span class="h">--color-success</span></div>
<div class="sw"><div class="chip" style="background:var(--color-warning-soft);border:1px solid var(--color-warning)"></div><span class="n">Warning</span><span class="h">--color-warning</span></div>
<div class="sw"><div class="chip" style="background:var(--color-danger-soft);border:1px solid var(--color-danger)"></div><span class="n">Danger</span><span class="h">--color-danger</span></div>
<div class="sw"><div class="chip" style="background:var(--color-info-soft);border:1px solid var(--color-info)"></div><span class="n">Info</span><span class="h">--color-info</span></div>
</div>
</body></html>
